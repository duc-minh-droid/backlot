<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" font-family="Segoe UI, system-ui, -apple-system, sans-serif">
  <defs>
    <filter id="rough" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.03" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2.2"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#9aa4b2"/>
    </marker>
    <marker id="arrT" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4cc2a0"/>
    </marker>
    <style>
      .t { fill: #e7ebf0; font-size: 13px; }
      .s { fill: #9aa4b2; font-size: 11.5px; }
      .m { fill: #c9d1db; font-size: 11px; font-family: Cascadia Mono, SF Mono, Menlo, monospace; }
      .h { fill: #5f6975; font-size: 11px; letter-spacing: 1.4px; }
      .box { fill: #15181c; stroke: #2e353e; stroke-width: 1.5; }
      .ln { stroke: #9aa4b2; stroke-width: 1.5; fill: none; }
      .ref { stroke: #4cc2a0; stroke-width: 1.8; fill: none; }
      .face { fill: #1b1f24; stroke: #5f6975; stroke-width: 1.3; }
    </style>
    <!-- a little sketched head, reused for every photo of the same person -->
    <g id="idris">
      <rect x="0" y="0" width="84" height="84" rx="8" fill="#101214" stroke="#3a424c"/>
      <path d="M14 84 C 18 62, 66 62, 70 84" class="face"/>
      <ellipse cx="42" cy="38" rx="17" ry="21" class="face"/>
      <path d="M26 44 C 30 62, 54 62, 58 44 C 54 52, 30 52, 26 44 z" fill="#5f6975"/>
      <path d="M27 28 C 30 16, 54 16, 57 28" stroke="#9aa4b2" stroke-width="3" fill="none"/>
      <circle cx="59" cy="44" r="2.6" fill="none" stroke="#e7ebf0" stroke-width="1.2"/>
    </g>
  </defs>

  <rect width="960" height="520" fill="#0a0b0d"/>
  <text x="32" y="40" class="t" font-size="18" font-weight="600">How one sentence becomes a person who stays the same</text>
  <text x="32" y="62" class="s">Only the first photo comes from text. Everything after it is generated from a photo, which is what keeps the face.</text>

  <!-- row 1: building the cast member -->
  <text x="32" y="100" class="h">1 · BUILD A CAST MEMBER (LIBRARY)</text>
  <g filter="url(#rough)"><rect x="32" y="112" width="220" height="120" rx="12" class="box"/></g>
  <text x="48" y="136" class="t">Idris · person</text>
  <text x="48" y="158" class="s">"a bearded man in his fifties</text>
  <text x="48" y="174" class="s">with deep-set eyes, close-cropped</text>
  <text x="48" y="190" class="s">grey hair and a silver hoop</text>
  <text x="48" y="206" class="s">earring"</text>

  <path d="M252 172 h54" class="ln" marker-end="url(#arr)"/>
  <text x="258" y="162" class="s" font-size="10.5">text only</text>

  <use href="#idris" x="312" y="130"/>
  <text x="312" y="232" class="s" font-size="10.5">plate 1 · kept</text>
  <text x="312" y="246" class="m" font-size="10">input/qwen-app/</text>

  <path d="M396 172 C 430 172, 440 150, 470 150" class="ref" marker-end="url(#arrT)"/>
  <path d="M396 172 C 430 172, 440 196, 470 196" class="ref" marker-end="url(#arrT)"/>
  <text x="404" y="134" class="s" font-size="10.5" style="fill:#4cc2a0">plate attached</text>

  <g transform="translate(476 112) scale(0.62)"><use href="#idris"/></g>
  <text x="534" y="140" class="s" font-size="10.5">three-quarter</text>
  <g transform="translate(476 182) scale(0.62)"><use href="#idris"/></g>
  <text x="534" y="210" class="s" font-size="10.5">profile</text>

  <g filter="url(#rough)"><rect x="640" y="112" width="288" height="120" rx="12" class="box"/></g>
  <text x="656" y="136" class="t">Why views are made from the photo</text>
  <text x="656" y="158" class="s">Re-rolling the description draws a stranger</text>
  <text x="656" y="174" class="s">every time. An extra angle is generated with</text>
  <text x="656" y="190" class="s">the kept plate as its reference, so it is the</text>
  <text x="656" y="206" class="s">same man turned, not a new one.</text>

  <!-- row 2: the shot -->
  <text x="32" y="286" class="h">2 · A SHOT WITH IDRIS IN IT (GENERATE)</text>
  <g filter="url(#rough)"><rect x="32" y="298" width="430" height="120" rx="12" class="box"/></g>
  <text x="48" y="322" class="s">the prompt, as the model reads it</text>
  <text x="48" y="346" class="m"><tspan style="fill:#4cc2a0">&lt;image1&gt; shows Idris.</tspan> a bearded man in his</text>
  <text x="48" y="360" class="m">fifties with deep-set eyes, ... hoop earring</text>
  <text x="48" y="376" class="m">A cinematic film still, ...: Idris is mending a</text>
  <text x="48" y="390" class="m">fishing net, on a harbour wall at dawn, ...</text>
  <text x="48" y="410" class="s" font-size="10.5">binding clause first, next to the auto-prepended image label</text>

  <path d="M462 358 h40" class="ln" marker-end="url(#arr)"/>

  <g filter="url(#rough)"><rect x="508" y="298" width="200" height="120" rx="12" class="box"/></g>
  <text x="522" y="322" class="t">TextEncodeQwenImage21</text>
  <rect x="522" y="336" width="172" height="30" rx="6" fill="#0e1a17" style="stroke:#4cc2a0"/>
  <text x="532" y="355" class="s" style="fill:#4cc2a0">VAE latent · ~4096 tok · identity</text>
  <rect x="522" y="374" width="172" height="30" rx="6" fill="#101214" stroke="#3a424c"/>
  <text x="532" y="393" class="s">vision tower · ~1024 tok</text>

  <path d="M708 358 h40" class="ln" marker-end="url(#arr)"/>
  <g filter="url(#rough)"><rect x="754" y="298" width="174" height="120" rx="12" class="box"/></g>
  <text x="768" y="322" class="t">Prefix KV cache</text>
  <text x="768" y="344" class="s">0.5 MiB per latent token</text>
  <text x="768" y="362" class="s">2 refs at 1024 ≈ 12.2k tok</text>
  <text x="768" y="380" class="s">≈ 6 GiB, priced by the cost</text>
  <text x="768" y="396" class="s">meter before you submit</text>

  <!-- row 3: follow-up -->
  <text x="32" y="456" class="h">3 · FOLLOW-UP</text>
  <text x="32" y="480" class="s">"make it night": the finished image is fetched back through /view, re-uploaded to <tspan class="m">input/qwen-app/followups</tspan> and becomes the</text>
  <text x="32" y="498" class="s">only reference, with an enumerated keep clause. It is a full re-generation, so drift accumulates after three or four in a row.</text>
</svg>
